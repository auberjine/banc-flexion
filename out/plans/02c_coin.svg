<text x="408.000" y="247.000" font-family="Helvetica,Arial,sans-serif" font-size="2.80" fill="#000" text-anchor="end" font-weight="normal">SENS DE MONTAGE : bout EPAIS du coin du cote oppose a la chape.</text>
<text x="408.000" y="243.200" font-family="Helvetica,Arial,sans-serif" font-size="2.80" fill="#000" text-anchor="end" font-weight="normal">02c : flancs du filet a 9,2 MPa ; pate cuivre (haute temperature) dans le taraudage.</text>
<text x="408.000" y="239.400" font-family="Helvetica,Arial,sans-serif" font-size="2.80" fill="#000" text-anchor="end" font-weight="normal">(helice 2,48 deg, frottement 5,28 deg a mu 0,08 : marge x2,13 ; un Tr16x4 tomberait a x0,91, reversible).</text>
<text x="408.000" y="235.600" font-family="Helvetica,Arial,sans-serif" font-size="2.80" fill="#000" text-anchor="end" font-weight="normal">02c : autobloquant seulement si mu &gt; 0,106 : on n y compte pas, c est le filet M16 x 2 qui tient la charge</text>
<text x="408.000" y="231.800" font-family="Helvetica,Arial,sans-serif" font-size="2.80" fill="#000" text-anchor="end" font-weight="normal">02c : commande 5,5 kN, couple 14,5 N.m a 12 kN ; un tour de vis : 0,425 mm de coulisseau, environ 549 N.</text>
<text x="408.000" y="228.000" font-family="Helvetica,Arial,sans-serif" font-size="2.80" fill="#000" text-anchor="end" font-weight="normal">02c : plaques de bronze usinees 06c (38 x 102) et 06d (38 x 104), ep. 5, tenues par les rebords, points de silicone HT.</text>
<text x="408.000" y="224.200" font-family="Helvetica,Arial,sans-serif" font-size="2.80" fill="#000" text-anchor="end" font-weight="normal">02c : pente du dessous (12 deg, celle du coulisseau) ; faces interieures des rebords du dessous NORMALES a la pente ; angles R1.</text>
<text x="408.000" y="220.400" font-family="Helvetica,Arial,sans-serif" font-size="2.80" fill="#000" text-anchor="end" font-weight="normal">02c : logements centres sur la longueur, sieges plans a 0,05 ; 55,2, 30,8 et 16 depuis les plans des sieges prolonges.</text>
<text x="408.000" y="216.600" font-family="Helvetica,Arial,sans-serif" font-size="2.80" fill="#000" text-anchor="end" font-weight="normal">Aretes vives non cotees cassees 0,8 x 45 deg.</text>
