<text x="28.466" y="275.100" font-family="Helvetica,Arial,sans-serif" font-size="2.80" fill="#000" text-anchor="start" font-weight="normal">MONTAGE : serrer le paquet sur V2, engager les tenons dans un flanc, chants fraises du cote du coin, puis presenter le second flanc.</text>
