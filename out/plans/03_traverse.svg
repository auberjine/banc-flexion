<text x="408.000" y="247.000" font-family="Helvetica,Arial,sans-serif" font-size="2.80" fill="#000" text-anchor="end" font-weight="normal">Les tenons portent par leur face HAUTE sur l arete superieure de la mortaise du flanc : pas de vis de traverse.</text>
<text x="408.000" y="243.200" font-family="Helvetica,Arial,sans-serif" font-size="2.80" fill="#000" text-anchor="end" font-weight="normal">Angles du contour non cotes : R2 ; pieds de tenon : detail A.</text>
<text x="408.000" y="239.400" font-family="Helvetica,Arial,sans-serif" font-size="2.80" fill="#000" text-anchor="end" font-weight="normal">puis paquet resserre sur V2, chants fraises poses sur un marbre.</text>
<text x="408.000" y="235.600" font-family="Helvetica,Arial,sans-serif" font-size="2.80" fill="#000" text-anchor="end" font-weight="normal">Aretes cassees 0,8 x 45 deg sur les deux faces APRES le fraisage (rainure en V de 1,6 a chaque joint, reserve de graisse),</text>
<text x="408.000" y="231.800" font-family="Helvetica,Arial,sans-serif" font-size="2.80" fill="#000" text-anchor="end" font-weight="normal">Chant fraise : planeite 0,05 sur le paquet, Ra 1,6 ; c est le plan de glissement de la plaque de bronze 06c, sans rectification.</text>
<text x="408.000" y="228.000" font-family="Helvetica,Arial,sans-serif" font-size="2.80" fill="#000" text-anchor="end" font-weight="normal">12 tenons (2 cales de plus de 6 sous les tenons, la coiffe passe entre), fraise a 58 de ces faces.</text>
<text x="408.000" y="224.200" font-family="Helvetica,Arial,sans-serif" font-size="2.80" fill="#000" text-anchor="end" font-weight="normal">CHANT DU BAS FRAISE EN PAQUET : les 6 plaques serrees par les 2 vis V2, paquet retourne et pose sur les faces HAUTES des</text>
<text x="408.000" y="220.400" font-family="Helvetica,Arial,sans-serif" font-size="2.80" fill="#000" text-anchor="end" font-weight="normal">Decoupe laser d apres traverse.dxf (calque DECOUPE) : le DXF est le BRUT, chant du bas descendu de 1 (65 de haut au lieu de 64).</text>
<text x="408.000" y="216.600" font-family="Helvetica,Arial,sans-serif" font-size="2.80" fill="#000" text-anchor="end" font-weight="normal">Matiere : S355JR, tole 8 mm du commerce : certificat 2.2 EN 10204 ; chant fraise frottant sur le bronze, sous pate graphite : admis a 7,6 MPa et a cette vitesse.</text>
<text x="127.466" y="18.700" font-family="Helvetica,Arial,sans-serif" font-size="3.60" fill="#000" text-anchor="middle" font-weight="bold">03  PLAQUE DE TRAVERSE, VUE SELON X  (2:1)</text>
