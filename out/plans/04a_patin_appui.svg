<text x="408.000" y="247.000" font-family="Helvetica,Arial,sans-serif" font-size="2.80" fill="#000" text-anchor="end" font-weight="normal">Un jeu neuf par eprouvette : 4 x 04a, 1 x 04b, 2 x 04c ; il part avec la poutrelle.</text>
<text x="408.000" y="243.200" font-family="Helvetica,Arial,sans-serif" font-size="2.80" fill="#000" text-anchor="end" font-weight="normal">Surfaces a coller : poncer P80 et degraisser a l acetone. Colle Duralco 4420, post-cuisson selon la notice avant charge.</text>
<text x="408.000" y="239.400" font-family="Helvetica,Arial,sans-serif" font-size="2.80" fill="#000" text-anchor="end" font-weight="normal">Collage (NOMENCLATURE.md, ordre de montage) : 04c etape 1, 04b etape 9 (centre au trace), 04a etape 13 ; polymeriser sous la precharge (etape 16).</text>
<text x="408.000" y="235.600" font-family="Helvetica,Arial,sans-serif" font-size="2.80" fill="#000" text-anchor="end" font-weight="normal">04a : colle par sa face superieure seulement, contre le plat ; rainure SECHE sur le bossage, qui doit y basculer.</text>
<text x="408.000" y="231.800" font-family="Helvetica,Arial,sans-serif" font-size="2.80" fill="#000" text-anchor="end" font-weight="normal">04a : le fond de rainure porte le bossage, 3 kN par patin (4 contacts, 2 par appui) : Hertz 339 MPa, limite 480 MPa a 150 C, coefficient 1,42 : S355JR au minimum.</text>
<text x="408.000" y="228.000" font-family="Helvetica,Arial,sans-serif" font-size="2.80" fill="#000" text-anchor="end" font-weight="normal">04a : rainure 9,5 = tole REELLE du flanc (EP_TOLE_REELLE_42 = 8) + 2 x 0,75 de jeu : mesurer la tole 42CrMo4 livree et regenerer ce plan.</text>
<text x="408.000" y="224.200" font-family="Helvetica,Arial,sans-serif" font-size="2.80" fill="#000" text-anchor="end" font-weight="normal">04a : decoupe laser d apres patin_appui.dxf (calque DECOUPE), PUIS rainure fraisee sur toute la longueur de la face d appui.</text>
<text x="408.000" y="220.400" font-family="Helvetica,Arial,sans-serif" font-size="2.80" fill="#000" text-anchor="end" font-weight="normal">Aretes vives des patins cassees 0,8 x 45 deg ; plat ebavure.</text>
<text x="208.500" y="45.650" font-family="Helvetica,Arial,sans-serif" font-size="3.60" fill="#000" text-anchor="middle" font-weight="bold">04a  PATIN D APPUI RAINURE, VUE DE DESSOUS  (1:1)</text>
<text x="208.500" y="50.250" font-family="Helvetica,Arial,sans-serif" font-size="2.80" fill="#000" text-anchor="middle" font-weight="normal">S355JR, 4 ex., brut tole 10 mm</text>
