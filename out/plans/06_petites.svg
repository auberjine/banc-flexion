<text x="408.000" y="247.000" font-family="Helvetica,Arial,sans-serif" font-size="2.80" fill="#000" text-anchor="end" font-weight="normal">06c / 06d : pieces du commerce, rien a fabriquer ; entre les rebords du coin 02c (larges de 6,25 dessus et 7,36 dessous), trous remplis de silicone HT.</text>
<text x="408.000" y="243.200" font-family="Helvetica,Arial,sans-serif" font-size="2.80" fill="#000" text-anchor="end" font-weight="normal">06b : la longueur 60 +0,1/0 fixe l ecart des flancs : couper les 9 en serie. Ne pas confondre avec 07b (meme tube, L 71,5, planche 07).</text>
<text x="408.000" y="239.400" font-family="Helvetica,Arial,sans-serif" font-size="2.80" fill="#000" text-anchor="end" font-weight="normal">06b : 7 serrees chacune par une V1 (vis TH M10 x 100 + ecrou autofreine tout metal), les 2 de la chape par les V9 (vis H M10 x 200).</text>
<text x="408.000" y="235.600" font-family="Helvetica,Arial,sans-serif" font-size="2.80" fill="#000" text-anchor="end" font-weight="normal">06a : colle au fond de l alesage 25 H8 du coulisseau (Loctite 648) ; il centre la pile 02e et coulisse dans le poussoir (jeu de 0,4 au moins dans les diam. 25,4). Rond etire h9 NON repris.</text>
