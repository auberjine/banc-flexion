<text x="408.000" y="243.200" font-family="Helvetica,Arial,sans-serif" font-size="2.80" fill="#000" text-anchor="end" font-weight="normal">Debout dans l etuve : 969,5 de haut, 458,6 x 510 en plan ; etuve 540 x 540 x 1400 A CONFIRMER.</text>

<text x="408.000" y="235.600" font-family="Helvetica,Arial,sans-serif" font-size="2.80" fill="#000" text-anchor="end" font-weight="normal">0,425 mm de coulisseau et environ 549 N par tour de tige.</text>
<text x="408.000" y="231.800" font-family="Helvetica,Arial,sans-serif" font-size="2.80" fill="#000" text-anchor="end" font-weight="normal">Reglage par coin acier a 12 deg et tige M16 normale aux flancs :</text>
<text x="408.000" y="228.000" font-family="Helvetica,Arial,sans-serif" font-size="2.80" fill="#000" text-anchor="end" font-weight="normal">Lecture de charge : 9,65 mm de coulisseau a 12 kN.</text>
<text x="408.000" y="224.200" font-family="Helvetica,Arial,sans-serif" font-size="2.80" fill="#000" text-anchor="end" font-weight="normal">Pile Belleville, 12 rondelles DIN 2093 A50 : 18,5 kN a plat, course 15,6 mm.</text>
<text x="408.000" y="220.400" font-family="Helvetica,Arial,sans-serif" font-size="2.80" fill="#000" text-anchor="end" font-weight="normal">Eprouvette : poutrelle 103 x 107 x 840, en trait mixte a deux tirets.</text>
<text x="408.000" y="216.600" font-family="Helvetica,Arial,sans-serif" font-size="2.80" fill="#000" text-anchor="end" font-weight="normal">Flexion 3 points, portee 750, capacite 12 kN.</text>

<text x="408.000" y="243.200" font-family="Helvetica,Arial,sans-serif" font-size="2.80" fill="#000" text-anchor="end" font-weight="normal">02b : goupilles V3 8 m6 libres dans les trous de passage, serrees dans le patin de charge 04b (8 H7).</text>
<text x="408.000" y="239.400" font-family="Helvetica,Arial,sans-serif" font-size="2.80" fill="#000" text-anchor="end" font-weight="normal">02b : 3 plateaux identiques empiles, decoupe laser (poussoir.dxf) ; le patin de charge 04b colle fait fond.</text>
<text x="408.000" y="235.600" font-family="Helvetica,Arial,sans-serif" font-size="2.80" fill="#000" text-anchor="end" font-weight="normal">02c : flancs du filet a 9,2 MPa ; pate cuivre (haute temperature) dans le taraudage.</text>
<text x="408.000" y="231.800" font-family="Helvetica,Arial,sans-serif" font-size="2.80" fill="#000" text-anchor="end" font-weight="normal">(helice 2,48 deg, frottement 5,28 deg a mu 0,08 : marge x2,13 ; un Tr16x4 tomberait a x0,91, reversible).</text>
<text x="408.000" y="228.000" font-family="Helvetica,Arial,sans-serif" font-size="2.80" fill="#000" text-anchor="end" font-weight="normal">02c : autobloquant seulement si mu &gt; 0,106 : on n y compte pas, c est le filet M16 x 2 qui tient la charge</text>
<text x="408.000" y="224.200" font-family="Helvetica,Arial,sans-serif" font-size="2.80" fill="#000" text-anchor="end" font-weight="normal">02c : commande 5,5 kN, couple 9,4 N.m a 12 kN ; un tour de vis : 0,425 mm de coulisseau, environ 549 N.</text>
<text x="408.000" y="220.400" font-family="Helvetica,Arial,sans-serif" font-size="2.80" fill="#000" text-anchor="end" font-weight="normal">02c : plaques du commerce norelem 38 x 100 x 5 (06c, 06d) tenues par les rebords, points de silicone HT.</text>
<text x="408.000" y="216.600" font-family="Helvetica,Arial,sans-serif" font-size="2.80" fill="#000" text-anchor="end" font-weight="normal">02c : pente du dessous (12 deg, celle du coulisseau) ; faces interieures des rebords du dessous NORMALES a la pente ; angles R1.</text>
<text x="408.000" y="212.800" font-family="Helvetica,Arial,sans-serif" font-size="2.80" fill="#000" text-anchor="end" font-weight="normal">02c : logements centres sur la longueur, sieges plans a 0,05 ; 55,2, 30,8 et 16 depuis les plans des sieges prolonges.</text>
<text x="408.000" y="209.000" font-family="Helvetica,Arial,sans-serif" font-size="2.80" fill="#000" text-anchor="end" font-weight="normal">02a : pente fraisee Ra 1,6, planeite 0,05 (la plaque basse 06d y glisse) ; bord EPAIS (36,2) cote chape.</text>
