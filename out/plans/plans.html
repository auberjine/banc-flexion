<text x="408.000" y="243.200" font-family="Helvetica,Arial,sans-serif" font-size="2.80" fill="#000" text-anchor="end" font-weight="normal">Debout dans l etuve : 969,5 de haut, 458,6 x 518,4 en plan ; etuve 538 x 528,4 x 1400.</text>
<text x="408.000" y="239.400" font-family="Helvetica,Arial,sans-serif" font-size="2.80" fill="#000" text-anchor="end" font-weight="normal">Hors tout couche sur pieds : 960 x 518,4 x 470 (x, y, z) ; flancs 76.</text>
<text x="408.000" y="235.600" font-family="Helvetica,Arial,sans-serif" font-size="2.80" fill="#000" text-anchor="end" font-weight="normal">0,425 mm de coulisseau et environ 549 N par tour de tige.</text>
<text x="408.000" y="231.800" font-family="Helvetica,Arial,sans-serif" font-size="2.80" fill="#000" text-anchor="end" font-weight="normal">Reglage par coin acier a 12 deg et tige M16 normale aux flancs :</text>
<text x="408.000" y="228.000" font-family="Helvetica,Arial,sans-serif" font-size="2.80" fill="#000" text-anchor="end" font-weight="normal">Lecture de charge : 9,65 mm de coulisseau a 12 kN.</text>
<text x="408.000" y="224.200" font-family="Helvetica,Arial,sans-serif" font-size="2.80" fill="#000" text-anchor="end" font-weight="normal">Pile Belleville, 12 rondelles DIN 2093 A50 : 18,5 kN a plat, course 15,6 mm.</text>
<text x="408.000" y="220.400" font-family="Helvetica,Arial,sans-serif" font-size="2.80" fill="#000" text-anchor="end" font-weight="normal">Eprouvette : poutrelle 103 x 107 x 840, en trait mixte a deux tirets.</text>
<text x="408.000" y="216.600" font-family="Helvetica,Arial,sans-serif" font-size="2.80" fill="#000" text-anchor="end" font-weight="normal">Flexion 3 points, portee 750, capacite 12 kN.</text>

<text x="408.000" y="243.200" font-family="Helvetica,Arial,sans-serif" font-size="2.80" fill="#000" text-anchor="end" font-weight="normal">Planeite 0,5 sur 960, ne pas redresser a chaud ; sommets des bossages coplanaires a 0,3.</text>
<text x="408.000" y="239.400" font-family="Helvetica,Arial,sans-serif" font-size="2.80" fill="#000" text-anchor="end" font-weight="normal">le second, tourne de 180 deg autour de Z, a sa graduation le long de la lumiere -X.</text>
<text x="408.000" y="235.600" font-family="Helvetica,Arial,sans-serif" font-size="2.80" fill="#000" text-anchor="end" font-weight="normal">Contour symetrique en X, graduation d'un seul cote : deux flancs identiques, face gravee a l'exterieur ;</text>
<text x="408.000" y="231.800" font-family="Helvetica,Arial,sans-serif" font-size="2.80" fill="#000" text-anchor="end" font-weight="normal">Aretes cassees 0,8 x 45 deg sur les deux faces, bossages compris (ils ne sont pas repris).</text>
<text x="408.000" y="228.000" font-family="Helvetica,Arial,sans-serif" font-size="2.80" fill="#000" text-anchor="end" font-weight="normal">Mesurer les deux toles livrees, regler EP_TOLE_REELLE_42 (42CrMo4) et EP_TOLE_REELLE_S355 (S355JR) et regenerer les DXF avant decoupe.</text>
<text x="408.000" y="224.200" font-family="Helvetica,Arial,sans-serif" font-size="2.80" fill="#000" text-anchor="end" font-weight="normal">mortaise 52 = 6 x tole + jeu 4.</text>
<text x="408.000" y="220.400" font-family="Helvetica,Arial,sans-serif" font-size="2.80" fill="#000" text-anchor="end" font-weight="normal">Encoches et mortaise taillees sur la tole S355 REELLE des pieds et de la traverse (EP_TOLE_REELLE_S355 = 8) : encoches 8,4 = tole + jeu 0,4 ;</text>
<text x="408.000" y="216.600" font-family="Helvetica,Arial,sans-serif" font-size="2.80" fill="#000" text-anchor="end" font-weight="normal">Matiere : 42CrMo4 recuit +A, tole 8 mm : certificat 3.1 EN 10204 avec essai de traction, Re &gt;= 430 MPa a 20 C.</text>
<text x="408.000" y="212.800" font-family="Helvetica,Arial,sans-serif" font-size="2.80" fill="#000" text-anchor="end" font-weight="normal">Decoupe et gravure laser d'apres flanc.dxf : calque DECOUPE coupe, GRAVURE marque sans traverser (detail Y).</text>

<text x="408.000" y="247.000" font-family="Helvetica,Arial,sans-serif" font-size="2.80" fill="#000" text-anchor="end" font-weight="normal">Un jeu neuf par eprouvette : 4 x 04a, 1 x 04b et ses 2 goupilles V3, 2 x 04c ; il part avec la poutrelle.</text>
<text x="408.000" y="243.200" font-family="Helvetica,Arial,sans-serif" font-size="2.80" fill="#000" text-anchor="end" font-weight="normal">Surfaces a coller : poncer P80 et degraisser a l acetone. Colle Duralco 4420, post-cuisson selon la notice avant charge.</text>
<text x="408.000" y="239.400" font-family="Helvetica,Arial,sans-serif" font-size="2.80" fill="#000" text-anchor="end" font-weight="normal">04a : colle par sa face superieure seulement, contre le plat ; rainure SECHE sur le bossage, qui doit y basculer.</text>
<text x="408.000" y="235.600" font-family="Helvetica,Arial,sans-serif" font-size="2.80" fill="#000" text-anchor="end" font-weight="normal">Collage (NOMENCLATURE.md, ordre de montage) : 04c etape 1, 04b etape 9, 04a etape 13 ; polymeriser sous la precharge (etape 16).</text>
<text x="408.000" y="231.800" font-family="Helvetica,Arial,sans-serif" font-size="2.80" fill="#000" text-anchor="end" font-weight="normal">04b : decoupe d apres patin_charge.dxf, avant-trous 6 ; PERCER puis ALESER les 2 trous 8 H7, ou les goupilles V3 (8 m6) sont serrees.</text>
<text x="408.000" y="228.000" font-family="Helvetica,Arial,sans-serif" font-size="2.80" fill="#000" text-anchor="end" font-weight="normal">04a : le fond de rainure porte le bossage, 3 kN par patin (4 contacts, 2 par appui) : Hertz 339 MPa, limite 480 MPa a 150 C, coefficient 1,42 : S355JR au minimum.</text>
<text x="408.000" y="224.200" font-family="Helvetica,Arial,sans-serif" font-size="2.80" fill="#000" text-anchor="end" font-weight="normal">04a : rainure 9,5 = tole REELLE du flanc (EP_TOLE_REELLE_42 = 8) + 2 x 0,75 de jeu : mesurer la tole 42CrMo4 livree et regenerer ce plan.</text>
<text x="408.000" y="220.400" font-family="Helvetica,Arial,sans-serif" font-size="2.80" fill="#000" text-anchor="end" font-weight="normal">04a : decoupe laser d apres patin_appui.dxf (calque DECOUPE), PUIS rainure fraisee sur toute la longueur de la face d appui.</text>

<text x="408.000" y="247.000" font-family="Helvetica,Arial,sans-serif" font-size="2.80" fill="#000" text-anchor="end" font-weight="normal">V8 : 0,1 a 0,3 de jeu axial, puis contre-bloques. V7 : douille de 24 et cliquet, une cle plate bute sur les V9.</text>
<text x="408.000" y="243.200" font-family="Helvetica,Arial,sans-serif" font-size="2.80" fill="#000" text-anchor="end" font-weight="normal">V9 : tete et 1 rondelle derriere le flanc oppose, 4 rondelles et 2 ecrous H cote platines ; le premier sur le filet (marge 5,5), 25 N.m, puis le contre-ecrou bloque contre lui.</text>
<text x="408.000" y="239.400" font-family="Helvetica,Arial,sans-serif" font-size="2.80" fill="#000" text-anchor="end" font-weight="normal">07b : 24,5 MPa chacune sous la commande, 135 environ avec la precharge des V9 (25 N.m, K = 0,2).</text>
<text x="408.000" y="235.600" font-family="Helvetica,Arial,sans-serif" font-size="2.80" fill="#000" text-anchor="end" font-weight="normal">Platine : 130 MPa en flexion, coefficient 3,3 a 20 C et 3,0 a 150 C, fleche 0,14 mm.</text>
<text x="408.000" y="231.800" font-family="Helvetica,Arial,sans-serif" font-size="2.80" fill="#000" text-anchor="end" font-weight="normal">Commande 5,5 kN : le coin tire la tige, la tete V7 pousse la butee V6 ; platines et 07b comprimees ; V9 : 329 N au desserrage.</text>
<text x="408.000" y="228.000" font-family="Helvetica,Arial,sans-serif" font-size="2.80" fill="#000" text-anchor="end" font-weight="normal">07b : tube de precision 20 x 2 E235+C EN 10305-1, coupe a la longueur cotee, les 2 a la meme butee, faces dressees.</text>
<text x="408.000" y="224.200" font-family="Helvetica,Arial,sans-serif" font-size="2.80" fill="#000" text-anchor="end" font-weight="normal">07 : decoupe laser d apres support.dxf, aretes cassees 0,8 x 45 deg ; 40 et 70 entre aretes fictives (au sommet R12, la tole mesure 69,46).</text>
<text x="408.000" y="220.400" font-family="Helvetica,Arial,sans-serif" font-size="2.80" fill="#000" text-anchor="end" font-weight="normal">07 : 42CrMo4 recuit +A, tole 8 mm : certificat 3.1 EN 10204 avec essai de traction, Re &gt;= 430 MPa a 20 C ; meme tole que les flancs, platines imbriquees dans leurs chutes.</text>
